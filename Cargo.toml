[package]
name = "Project_tkachenko"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full", "rt-multi-thread"] }
rand = "0.8"
clap = { version = "4", features = ["derive"] }
ratatui = "0.26"
crossterm = "0.27"
priority-queue = "1.3"

[profile.release]
opt-level = 3